name: brevly

services:
  postgres:
    image: postgres:17-alpine
    container_name: brevly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brevly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brevly}
      POSTGRES_DB: ${POSTGRES_DB:-brevly}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - brevly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-brevly} -d ${POSTGRES_DB:-brevly}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brevly-pgdata:
